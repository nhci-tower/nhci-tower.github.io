const segs=p=>String(p).split("/").filter(Boolean);

      READY.then(()=>{if(!L.dead){LIST.add(L);L.run();rt()}});return ()=>{L.dead=true;LIST.delete(L)}},
    doc:id=>makeDoc(parent+"/"+(id||(Date.now().toString(36)+Math.random().toString(36).slice(2,10)))),
    add:async data=>{const d=makeDoc(parent+"/"+(Date.now().toString(36)+Math.random().toString(36).slice(2,10)));await d.set(data);return d}};return Q}

  const r=await fetch(SB_URL+"/functions/v1/ai",{method:"POST",signal,headers:{"Content-Type":"application/json",Authorization:"Bearer "+session.access_token,apikey:SB_KEY},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));if(!r.ok||j.error){const e=j.error||{};throw err(e.code==="no_key"?"unavailable":e.type||e.code||"upstream_error",e.code==="no_key"?"المساعد الذكي لسه ما اتفعّلش — محتاج مفتاح Anthropic":(e.message||"AI error"))}return j}
const toBlocks=c=>typeof c==="string"?c:(Array.isArray(c)?c:[{type:"text",text:String(c)}]);

  for(let turn=0;turn<10;turn++){const res=await callAI({messages:msgs,system:opts.system,max_tokens:opts.maxTokens||2048,tools:tools.map(t=>({name:t.name,description:t.description,input_schema:t.inputSchema||{type:"object",properties:{}}}))},opts.signal);
    const tx=(res.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");if(tx){text=tx;opts.onText&&opts.onText({text})}
    const uses=(res.content||[]).filter(b=>b.type==="tool_use");if(!uses.length||res.stop_reason!=="tool_use")break;
    msgs.push({role:"assistant",content:res.content});const results=[];for(const u of uses){const t=tools.find(x=>x.name===u.name);let out;try{out=t?await t.execute(u.input||{}):{error:"unknown tool"}}catch(e){out={error:String(e&&e.message||e)}}results.push({type:"tool_result",tool_use_id:u.id,content:JSON.stringify(out==null?null:out).slice(0,60000)})}

  return {text}}

sample.json=async(prompt,opts)=>{opts=opts||{};const content=[];(opts.images||[]).forEach(im=>{const s=typeof im==="string"?im:(im.dataUrl||im.url||"");const m=s.match(/^data:(image\/[a-z+]+);base64,(.*)$/);if(m)content.push({type:"image",source:{type:"base64",media_type:m[1],data:m[2]}})});
  content.push({type:"text",text:String(prompt)+"\n\nأجب بـ JSON صالح فقط بدون أي نص آخر."});const r=await callAI({messages:[{role:"user",content}],max_tokens:4096},opts.signal);
  const t=(r.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");const m=t.match(/[\[{][\s\S]*[\]}]/);try{return JSON.parse(m?m[0]:t)}catch(e){throw err("upstream_error","bad JSON")}};

/* ---------- tts / dictation / downloads ---------- */
function tts(){if(!("speechSynthesis" in window))return null;const S=new Set();let on=false;const set=(s,r)=>{on=s!=="idle";S.forEach(f=>f({state:s,reason:r}))};
  return {speak:text=>new Promise((res,rej)=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text));u.lang=/[؀-ۿ]/.test(text)?"ar-SA":"en-US";const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith(u.lang.slice(0,2)));if(v)u.voice=v;u.onstart=()=>set("speaking");u.onend=()=>{set("idle");res()};u.onerror=e=>{set("idle");rej(err("upstream_error",e.error))};speechSynthesis.speak(u)}),
    stop:async()=>{speechSynthesis.cancel();set("idle")},active:()=>on,onState:f=>{S.add(f);return ()=>S.delete(f)}}}
function dictation(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return null;let rec=null,on=false;const P=new Set(),F=new Set(),S=new Set();const st=(s,r)=>{on=s!=="idle";S.forEach(f=>f({state:s,reason:r}))};
  return {start:(o)=>new Promise((res,rej)=>{try{rec=new R();rec.lang=(o&&o.language)||"ar-SA";rec.continuous=true;rec.interimResults=true;
      rec.onstart=()=>{st("listening");res()};rec.onerror=e=>{st("idle",e.error==="not-allowed"?"not_granted":e.error);rej(err(e.error==="not-allowed"?"not_granted":"upstream_error",e.error))};rec.onend=()=>st("idle");
      rec.onresult=e=>{let part="";for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)F.forEach(f=>f({text:r[0].transcript+" "}));else part+=r[0].transcript}P.forEach(f=>f({text:part}))};rec.start()}catch(e){rej(err("upstream_error",String(e)))}}),
    stop:async()=>{try{rec&&rec.stop()}catch(e){}},active:()=>on,onPartial:f=>{P.add(f);return ()=>P.delete(f)},onFinal:f=>{F.add(f);return ()=>F.delete(f)},onState:f=>{S.add(f);return ()=>S.delete(f)}}}
const downloads={save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=filename||"file";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}};

/* ---------- window.claude ---------- */
const MEMO={};
window.claude={use:async name=>{if(name in MEMO)return MEMO[name];const p=(async()=>{switch(name){
  case "db":await READY;return DB;case "user":await READY;return USER;case "room":await READY;return room();case "sample":await READY;return sample;
  case "tts":return tts();case "dictation":return dictation();case "downloads":return downloads;default:return null}})();MEMO[name]=p;return p}};
window.NHCI_SB={get client(){return sb},get role(){return ROLE},signOut:async()=>{await sb.auth.signOut();location.reload()}};

  g.querySelectorAll("select").forEach(s=>s.onchange=async()=>{const {error}=s.dataset.l!==undefined?await sb.from("members").update({legacy_id:s.value||null}).eq("user_id",s.dataset.l):await sb.from("members").update({role:s.value}).eq("user_id",s.dataset.u);g.querySelector("#nxM").textContent=error?error.message:"✓ اتحفظ"});g.querySelector("#nxX").onclick=gateClose};
})();

  const {data,error}=await sb.from("app_secret").select("k").eq("id",1).maybeSingle();if(error||!data)throw new Error(error?error.message:"no key");
  const kb=Uint8Array.from(atob(data.k),c=>c.charCodeAt(0));const key=await crypto.subtle.importKey("raw",kb,"AES-GCM",false,["decrypt"]);
  const r=await fetch("app.enc",{cache:"no-cache"});const buf=new Uint8Array(await r.arrayBuffer());
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:buf.slice(0,12)},key,buf.slice(12));let html=new TextDecoder().decode(pt);
  html=html.replace(/<head([^>]*)>/i,'<head$1><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2b6ca2"><link rel="apple-touch-icon" href="icon-180.png">');
  document.open();document.write(html);document.close()}
